name: Integracion Continua API Estudiantes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Compilar y Construir Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Construir Imagen Docker
        run: docker build -t api-estudiantes:ci .
